services:
  db:
    image: postgres:16-alpine
    container_name: requestlog-db
    environment:
      POSTGRES_DB: ${DB_NAME:-requestlog}
      POSTGRES_USER: ${DB_USER:-requestlog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-requestlog}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-requestlog} -d ${DB_NAME:-requestlog}"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: requestlog-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/admin_password:/etc/prometheus/admin_password:ro,Z
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:13.2.4
    container_name: requestlog-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  pgdata:
  grafana:
