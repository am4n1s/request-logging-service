spring.application.name=request-log-service
# dev включает демо-эндпоинты (/ok, /slow, /async-slow, /cpu-bound, /fail). В проде уберите.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL из docker-compose.yml
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:requestlog}
spring.datasource.username=${DB_USER:requestlog}
spring.datasource.password=${DB_PASSWORD:requestlog}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ограничение размера страницы в /logs
spring.data.web.pageable.max-page-size=200

management.endpoints.web.exposure.include=health,info,metrics

# учётка администратора: задавайте через переменные окружения
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:change-me}

management.endpoints.web.exposure.include=health,info,metrics,prometheus